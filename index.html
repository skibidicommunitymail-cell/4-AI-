<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-AI Hub</title>
<meta name="description" content="Совместная работа Grok, ChatGPT, Claude и Gemini в одном окне">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg id="logo" class="logo" viewBox="0 0 60 100" data-d="0" role="img" aria-label="4-AI Hub">
  <line class="seg a" x1="12" y1="10" x2="48" y2="10" style="--k:0;--y:-30px"/>
  <line class="seg b" x1="50" y1="12" x2="50" y2="46" style="--k:1;--y:-20px"/>
  <line class="seg g" x1="12" y1="50" x2="48" y2="50" style="--k:2;--y:0px"/>
  <line class="seg c" x1="50" y1="54" x2="50" y2="88" style="--k:3;--y:20px"/>
  <line class="seg d" x1="12" y1="90" x2="48" y2="90" style="--k:4;--y:30px"/>
  <line class="seg f" x1="10" y1="12" x2="10" y2="46" style="--k:0;--y:-20px"/>
</svg>
<header><button id="keysBtn" class="btn ghost" hidden>API ключи</button></header>

<section id="onb" hidden>
  <h1 class="wel"><i></i><span>Добро пожаловать</span><i></i></h1>
  <div id="cards" class="grid"></div>
  <form id="keys">
    <div id="inputs" class="grid"></div>
    <button class="btn">Проверить и запустить</button>
  </form>
  <p id="err" class="note"></p>
</section>

<section id="check" hidden>
  <div class="spin"></div>
  <svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <p>Проверка состояния узлов...</p>
</section>

<main id="app" hidden>
  <div id="stage"><canvas id="cv"></canvas></div>
  <section id="chat" hidden></section>
  <form id="composer">
    <div id="files"></div>
    <textarea id="q" rows="2" placeholder="Опишите задачу"></textarea>
    <div class="row">
      <label class="btn ghost">Прикрепить файл<input id="file" type="file" multiple hidden></label>
      <button class="btn">Отправить</button>
    </div>
  </form>
</main>

<dialog id="dlg"></dialog>
<script src="js/providers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
